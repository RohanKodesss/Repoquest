  <!-- Terminal / Dungeon Door Folder Icon -->
  <g transform="translate(24, 25)">
    <!-- Folder Silhouette -->
    <path d="M 0 10 C 0 5, 5 0, 10 0 L 25 0 C 28 0, 30 2, 32 5 L 38 12 L 60 12 C 65 12, 70 17, 70 22 L 70 60 C 70 65, 65 70, 60 70 L 10 70 C 5 70, 0 65, 0 60 Z" fill="none" stroke="#00ff00" stroke-width="3.5" stroke-linejoin="round"/>
